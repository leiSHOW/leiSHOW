name: generate activity graph

on:
  # run automatically every day (01:00 Beijing time)
  schedule:
    - cron: "0 17 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # generates a light activity graph and stores it in dist/
      - name: generate light activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=github-compact&hide_border=true&area=true&hide_title=true&color=333333
          output_path: dist/github-activity-graph-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # generates a dark activity graph and stores it in dist/
      - name: generate dark activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=github-compact&hide_border=true&area=true&hide_title=true&color=c9d1d9
          output_path: dist/github-activity-graph-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # push the generated files to the output branch
      - name: push activity graph to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
